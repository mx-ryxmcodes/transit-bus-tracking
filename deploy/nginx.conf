# /etc/nginx/sites-available/transit  (replace example.com; then: certbot --nginx -d example.com)
# HTTPS is REQUIRED in production: browsers only expose geolocation (driver GPS) on secure origins.
server {
  listen 80;
  server_name example.com;

  # REST API
  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO (WebSocket upgrade)
  location /socket.io/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Next.js
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
# Production env: frontend NEXT_PUBLIC_WS_URL=https://example.com (same origin), backend CORS_ORIGIN=https://example.com
